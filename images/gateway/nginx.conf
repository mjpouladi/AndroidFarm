worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    # Nginx initializes these module paths even without matching upstreams.
    # The root filesystem is read-only; /tmp is the writable tmpfs.
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 10m;

    # Docker's embedded resolver re-resolves on-demand screen containers.
    # A missing/stopped device yields 502 and never falls back to another device.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Reject ambiguous/traversing paths before Nginx URI normalization can
    # change which application owns the route. Query strings are unaffected.
    map $request_uri $unsafe_path {
        default 0;
        ~*^[^?]*%(?:00|25|2e|2f|5c|3f|23) 1;
        ~^[^?]*/[.][.]?(?:/|[?]|$) 1;
    }

    server {
        listen 8080 default_server;
        server_name _;
        # Relative redirects preserve the external IP and published port.
        absolute_redirect off;
        auth_basic "Android Farm";
        auth_basic_user_file /run/gateway-private/farm-users.htpasswd;

        if ($unsafe_path) { return 400; }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The outer Basic Auth is not an upstream application's credential.
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        location = /metrics { return 308 /metrics/; }
        location ^~ /metrics/ {
            set $grafana_upstream http://android-farm-grafana:3000;
            proxy_pass $grafana_upstream$request_uri;
        }

        # Canonical num01..num8192 only: the user can never supply a hostname,
        # port or scheme. Keep this ceiling synchronized with ops/device_ids.py.
        location ~ "^/d/(?<device>num(?:0[1-9]|[1-9][0-9]{1,2}|[1-7][0-9]{3}|80[0-9]{2}|81[0-8][0-9]|819[0-2]))(?<screen_path>/.*)$" {
            set $screen_upstream http://screen-$device:6080;
            proxy_pass $screen_upstream$screen_path$is_args$args;
        }
        # Malformed device routes must not be sent to the console SPA.
        location = /d { return 404; }
        location /d/ { return 404; }

        location / {
            set $console_upstream http://farm-console:8080;
            proxy_pass $console_upstream$request_uri;
        }
    }

    # Container-only liveness listener, never published and never a public
    # unauthenticated exception on the main HTTP listener.
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / { return 404; }
    }
}
