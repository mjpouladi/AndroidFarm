---
- name: Restart farm API
  ansible.builtin.systemd:
    name: android-farm-api.service
    state: restarted
    daemon_reload: true
  when: farm_api_enabled | bool and not ansible_check_mode

- name: Restart redis
  ansible.builtin.systemd:
    name: redis-server
    state: restarted
  when: farm_manage_redis | bool and not ansible_check_mode

- name: Restart farm worker
  ansible.builtin.systemd:
    name: android-farm-worker.service
    state: restarted
    daemon_reload: true
  when: farm_worker_enabled | bool and not ansible_check_mode

- name: Reload health timer
  ansible.builtin.systemd:
    name: android-farm-health.timer
    state: restarted
    daemon_reload: true
  when: farm_health_enabled | bool and not ansible_check_mode
