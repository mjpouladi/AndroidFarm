#cloud-config
# Supply a fresh Ubuntu 24.04 cloud image through your provider.
# This file does not partition disks or replace an existing operating system.
package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - python3
ssh_pwauth: false
disable_root: true
users:
  - default
  - name: farm-admin
    groups: [sudo]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - REPLACE_WITH_YOUR_SSH_PUBLIC_KEY
final_message: "Ubuntu prepared. Connect through SSH; run the reviewed Android Farm bootstrap. Never place proxy credentials or API tokens in cloud-init user-data."
