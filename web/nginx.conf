server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  location /api/ { return 404; }
  # A stopped device has no Traefik router. Never show the console SPA in its place.
  location = /d { return 404; }
  location ^~ /d/ { return 404; }
  location /healthz { access_log off; return 200 'ok'; }
  location / { try_files $uri $uri/ /index.html; }
}
