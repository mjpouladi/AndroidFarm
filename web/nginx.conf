map $http_upgrade $console_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  # Raw APK uploads only: the API re-checks size, type and authentication.
  location = /api/v1/artifacts/upload {
    client_max_body_size 256m;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_pass http://unix:/run/farm-api/control.sock;
  }
  location /api/ {
    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # The API independently verifies this credential; do not trust a user header.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 60s;
    proxy_next_upstream off;
    proxy_buffering off;
    # No URI suffix: retain /api/... when forwarding to the Unix socket.
    proxy_pass http://unix:/run/farm-api/control.sock;
  }
  # Separate console and device domains still embed a same-origin screen.
  # Resolve at request time: the gateway itself depends on console startup.
  location = /d { return 404; }
  location ^~ /d/ {
    # Screen's noVNC/redirect HTML uses inline scripts. Defining the security
    # headers here prevents inheriting the console-only CSP for this location.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $console_connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    # Gateway validates the original, unnormalized route and canonical ID.
    # Its /d/ route never falls back to the console or another device.
    set $screen_gateway http://android-farm-gateway:8080;
    proxy_pass $screen_gateway$request_uri;
  }
  location /healthz { access_log off; return 200 'ok'; }
  location / { try_files $uri $uri/ /index.html; }
}
