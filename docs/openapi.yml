openapi: 3.1.0
info:
  title: Android Farm Control API
  version: 0.1.0-design
  description: قرارداد طراحی backend آینده؛ این API هنوز اجرا نشده است.
servers:
  - url: https://farm.example.com/api/v1
security:
  - sessionCookie: []
paths:
  /me:
    get:
      operationId: get_me
      summary: کاربر و مجوزهای فعلی
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200':
          description: شناسه، نام نمایشی، نقش و مجوزهای محاسبه‌شده سمت سرور
        default: { $ref: '#/components/responses/Error' }
  /devices:
    get:
      operationId: get_devices
      summary: فهرست دستگاه‌های مجاز با شمارهٔ پوشانده‌شده
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200':
          description: صفحه دستگاه‌ها
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Device' } }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: post_devices
      summary: ایجاد دستگاه؛ فقط مدیر، شماره یکتا و پراکسی تخصیص‌نیافته
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [alias, phone_e164, proxy_id]
              properties:
                alias: { type: string, minLength: 1, maxLength: 80 }
                phone_e164: { type: string, pattern: '^\+[1-9][0-9]{9,14}$', writeOnly: true }
                proxy_id: { type: string, format: uuid }
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Error' }
  /devices/{device_id}:
    parameters:
      - { $ref: '#/components/parameters/DeviceId' }
    get:
      operationId: get_devices_device_id
      summary: وضعیت مشاهده‌شده و مجوز عملیات Device
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200':
          description: دستگاه
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        default: { $ref: '#/components/responses/Error' }
  /sessions:
    get:
      operationId: get_sessions
      summary: جلسات فعال و صف متعلق به کاربر؛ مدیر تمام جلسات مجاز را می‌بیند
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200': { description: items به ترتیب requested_at به همراه cursor }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: post_sessions
      summary: درخواست جلسه با رزرو ظرفیت سمت سرور
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id, lease_minutes]
              properties:
                device_id: { type: string, pattern: '^num[0-9]{2,3}$' }
                lease_minutes: { type: integer, minimum: 5, maximum: 120, default: 30 }
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{session_id}/stop:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post_sessions_session_id_stop
      summary: پایان idempotent جلسهٔ خود یا با اختیار مدیر
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{session_id}/extend:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post_sessions_session_id_extend
      summary: تمدید lease با مجوز و سقف policy سرور
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              additionalProperties: false
              properties:
                minutes: { type: integer, minimum: 5, maximum: 30 }
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200': { description: lease_until جدید }
        default: { $ref: '#/components/responses/Error' }
  /devices/{device_id}/screen-grant:
    parameters:
      - { $ref: '#/components/parameters/DeviceId' }
    post:
      operationId: post_devices_device_id_screen_grant
      summary: مجوز کوتاه‌عمر کنترل صفحه؛ کاربر باید مالک جلسهٔ آماده باشد
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200':
          description: cookie امن محدود به مسیر Device؛ پاسخ فقط path، token در URL نیست
        default: { $ref: '#/components/responses/Error' }
  /jobs/{job_id}:
    parameters:
      - { $ref: '#/components/parameters/JobId' }
    get:
      operationId: get_jobs_job_id
      summary: مرحله، نتیجه و خطای امن job مجاز
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200':
          description: وضعیت کار
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{job_id}/cancel:
    parameters:
      - { $ref: '#/components/parameters/JobId' }
    post:
      operationId: post_jobs_job_id_cancel
      summary: لغو job صف؛ job شروع‌شده باید با stop جبران شود
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/Idempotency' }
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200': { description: لغوشده }
        default: { $ref: '#/components/responses/Error' }
  /proxies:
    get:
      operationId: get_proxies
      summary: metadata پراکسی‌های مجاز؛ بدون secret_ref و credential
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200': { description: items شامل device_id، کشور، سلامت و checked_at }
        default: { $ref: '#/components/responses/Error' }
  /devices/{device_id}/proxy-check:
    parameters:
      - { $ref: '#/components/parameters/DeviceId' }
    post:
      operationId: post_devices_device_id_proxy_check
      summary: آزمون خروجی پراکسی بدون چرخاندن session یا افشای credential
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/Idempotency' }
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Error' }
  /backups:
    get:
      operationId: get_backups
      summary: رکوردهای پشتیبان مجاز و وضعیت verify
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200': { description: items شامل backup_id، device_id، created_at، size و state }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: post_backups
      summary: بکاپ دستگاه خاموش با قفل انحصاری
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/Idempotency' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id]
              properties:
                device_id: { type: string }
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Error' }
  /backups/{backup_id}/restore:
    parameters:
      - { name: backup_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post_backups_backup_id_restore
      summary: مدیر؛ بازیابی verify‌شده به volume جدید، بدون بازنویسی volume اصلی
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/Idempotency' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm_device_id, expected_generation]
              properties:
                confirm_device_id: { type: string }
                expected_generation: { type: integer, minimum: 0 }
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Error' }
  /events:
    get:
      operationId: get_events
      summary: SSE فقط برای منابع مجاز با امکان resume
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200':
          description: device.updated، job.updated، capacity.updated، heartbeat؛ بدون شمارهٔ کامل
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /audit:
    get:
      operationId: get_audit
      summary: رویدادهای مجاز و immutable با cursor
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: device_id, in: query, schema: { type: string } }
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200': { description: items و next_cursor؛ بدون payload محرمانه }
        default: { $ref: '#/components/responses/Error' }
  /settings:
    get:
      operationId: get_settings
      summary: policy مؤثر سرور برای نمایش در UI
      responses:
        '401': { description: 'نشست معتبر نیست؛ ورود مجدد لازم است' }
        '200': { description: max_active، lease، retention و capabilities؛ فقط مقادیر غیرمحرمانه }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: farm_session
  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string, pattern: '^num(0[1-9]|[1-9][0-9]|1[0-9]{2}|200)$' }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16 }
  responses:
    Accepted:
      description: درخواست ثبت شد؛ موفقیت اجرای Docker هنوز تأیید نشده
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Job' }
    Error:
      description: '401 ورود لازم، 403 ممنوع، 404 موجود نیست، 409 تعارض، 422 ورودی، 429 محدودیت، 503 میزبان unavailable'
      content:
        application/json:
          schema:
            type: object
            required: [code, message, request_id]
            properties:
              code: { type: string }
              message: { type: string }
              request_id: { type: string, format: uuid }
  schemas:
    Device:
      type: object
      required: [id, alias, phone_masked, state, generation, observed_at, allowed_actions]
      properties:
        id: { type: string }
        alias: { type: string }
        phone_masked: { type: string }
        state: { type: string, enum: [provisioning, stopped, queued, starting, verifying, ready, stopping, backing_up, restoring, unknown, error, retired] }
        generation: { type: integer, minimum: 0 }
        observed_at: { type: [string, 'null'], format: date-time }
        allowed_actions: { type: array, items: { type: string, enum: [start, stop, screen, backup, proxy_check] } }
    Job:
      type: object
      required: [id, status, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: [string, 'null'], format: uuid }
        device_id: { type: [string, 'null'] }
        status: { type: string, enum: [queued, claimed, running, succeeded, failed, cancelled, unknown] }
        created_at: { type: string, format: date-time }
        error_code: { type: [string, 'null'] }
