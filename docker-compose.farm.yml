{
  "name": "android-farm-devices",
  "services": {
    "farm-anchor": {
      "image": "alpine:3.21",
      "container_name": "farm-anchor",
      "command": [
        "sleep",
        "infinity"
      ],
      "restart": "unless-stopped",
      "network_mode": "none",
      "mem_limit": "32m",
      "cpus": 0.1,
      "labels": {
        "farm.stack": "core",
        "traefik.enable": "false"
      }
    },
    "proxy-num01": {
      "container_name": "proxy-num01",
      "profiles": [
        "manual"
      ],
      "restart": "no",
      "mem_limit": "256m",
      "cpus": 0.5,
      "pids_limit": 256,
      "labels": {
        "farm.device": "num01",
        "farm.stack": "devices",
        "farm.role": "proxy",
        "traefik.enable": "false"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "image": "${PROXY_IMAGE:-android-farm/proxy:1}",
      "build": {
        "context": ".",
        "dockerfile": "images/proxy/Dockerfile"
      },
      "cap_add": [
        "NET_ADMIN"
      ],
      "cap_drop": [
        "NET_RAW"
      ],
      "sysctls": {
        "net.ipv6.conf.all.disable_ipv6": "1"
      },
      "environment": {
        "CONTROL_CIDR": "10.232.1.0/29",
        "EGRESS_CIDR": "10.231.1.0/29"
      },
      "networks": {
        "egress-num01": {
          "ipv4_address": "10.231.1.2",
          "gw_priority": 1
        },
        "control-num01": {
          "ipv4_address": "10.232.1.2"
        }
      },
      "ports": [
        "127.0.0.1:5551:5555"
      ],
      "secrets": [
        {
          "source": "proxy-num01",
          "target": "proxy.json"
        }
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "/healthcheck.sh"
        ],
        "interval": "20s",
        "timeout": "10s",
        "retries": 3,
        "start_period": "15s"
      }
    },
    "android-num01": {
      "container_name": "android-num01",
      "profiles": [
        "manual"
      ],
      "restart": "no",
      "mem_limit": "4g",
      "cpus": 4.0,
      "pids_limit": 2048,
      "labels": {
        "farm.device": "num01",
        "farm.stack": "devices",
        "farm.role": "android",
        "traefik.enable": "false"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "image": "${REDROID_IMAGE:-redroid/redroid:12.0.0-latest}",
      "privileged": true,
      "network_mode": "service:proxy-num01",
      "depends_on": {
        "proxy-num01": {
          "condition": "service_healthy"
        }
      },
      "volumes": [
        "redroid-data-num01:/data"
      ],
      "stop_grace_period": "60s",
      "command": [
        "androidboot.redroid_width=720",
        "androidboot.redroid_height=1280",
        "androidboot.redroid_dpi=240",
        "androidboot.redroid_fps=20",
        "androidboot.redroid_gpu_mode=guest",
        "androidboot.use_memfd=true",
        "androidboot.redroid_dns=1.1.1.1",
        "androidboot.serialno=farm-num01",
        "ro.product.brand=redroid",
        "ro.product.manufacturer=remote-android",
        "ro.product.model=Redroid QA Phone"
      ]
    },
    "screen-num01": {
      "container_name": "screen-num01",
      "profiles": [
        "manual"
      ],
      "restart": "no",
      "mem_limit": "1g",
      "cpus": 1.5,
      "pids_limit": 256,
      "labels": {
        "farm.device": "num01",
        "farm.stack": "devices",
        "farm.role": "screen",
        "traefik.enable": "true",
        "traefik.docker.network": "${COOLIFY_NETWORK:-coolify}",
        "traefik.http.routers.farm-num01.rule": "Host(`${FARM_DOMAIN:-farm.example.com}`) && PathPrefix(`/d/num01/`)",
        "traefik.http.routers.farm-num01.entrypoints": "https",
        "traefik.http.routers.farm-num01.tls": "true",
        "traefik.http.routers.farm-num01.tls.certresolver": "letsencrypt",
        "traefik.http.routers.farm-num01.middlewares": "farm-auth@file,farm-num01-strip",
        "traefik.http.routers.farm-num01.service": "farm-num01",
        "traefik.http.middlewares.farm-num01-strip.stripprefix.prefixes": "/d/num01",
        "traefik.http.services.farm-num01.loadbalancer.server.port": "6080"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "image": "${SCREEN_IMAGE:-android-farm/screen:1}",
      "build": {
        "context": ".",
        "dockerfile": "images/screen/Dockerfile"
      },
      "init": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "environment": {
        "DEVICE_ID": "num01",
        "ADB_TARGET": "10.232.1.2:5555"
      },
      "networks": {
        "coolify": {},
        "control-num01": {
          "ipv4_address": "10.232.1.3"
        }
      },
      "depends_on": {
        "android-num01": {
          "condition": "service_started"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:6080/vnc.html"
        ],
        "interval": "30s",
        "timeout": "5s",
        "retries": 3
      }
    },
