# Promtail ships the stdout/stderr of every farm container (core stack and
# on-demand devices) to Loki. Containers are discovered through the Docker
# socket, which is mounted read-only; the filter keeps unrelated Coolify
# containers out of the farm's log store. Labels come from the farm.* labels
# every managed container carries, so each device is searchable on its own.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: farm-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["farm.stack"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_label_farm_stack]
        target_label: stack
      - source_labels: [__meta_docker_container_label_farm_role]
        target_label: role
      - source_labels: [__meta_docker_container_label_farm_device]
        target_label: device
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      # Proxy credentials or tokens must never be indexed if a tool prints them.
      - replace:
          expression: '(?i)((?:password|passwd|token|secret)\s*[=:]\s*)\S+'
          replace: '${1}[REDACTED]'
      - replace:
          expression: '([A-Za-z][A-Za-z0-9+.-]*://)[^/@\s]+@'
          replace: '${1}[REDACTED]@'
