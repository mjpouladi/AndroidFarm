global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Alerts leave Prometheus only towards the internal Alertmanager; Grafana's
# Alertmanager datasource shows them and alertmanager.yml holds the receivers.
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]
