# Alertmanager for the Android Farm rules in alerts.yml. It only listens on the
# internal monitoring network; Grafana shows its alerts through the provisioned
# Alertmanager datasource. Add an organisational receiver below (email, Slack
# or a webhook) and keep its credentials in this root-private release copy.
global:
  resolve_timeout: 5m

route:
  receiver: farm-operators
  group_by: [alertname, device]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: farm-operators
      repeat_interval: 1h

receivers:
  - name: farm-operators
    # Example (uncomment and fill in from your organisation's secrets):
    # email_configs:
    #   - to: qa-oncall@example.com
    #     from: android-farm@example.com
    #     smarthost: smtp.example.com:587
    #     auth_username: android-farm@example.com
    #     auth_password: REPLACE_WITH_SMTP_PASSWORD
    # webhook_configs:
    #   - url: https://hooks.example.com/android-farm

inhibit_rules:
  - source_matchers: [alertname="AndroidFarmProbeFailed"]
    target_matchers: [severity="warning"]
    equal: [device]
